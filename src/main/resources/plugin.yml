name: RideOnHead
description: A lightweight plugin that lets players sit on each other's heads
prefix: RideOnHead

version: "1.1.1"
main: ru.deelter.rideonhead.RideOnHead
api-version: "1.21"

authors: [ DeelTer ]
website: https://deelter.ru
load: POSTWORLD

commands:
  ride:
    description: Manage head-riding mechanics
    usage: /<command> [toggle|blacklist|reload]
    aliases: [ridehead]
permissions:
  rideonhead.user:
    description: Allows usage of basic ride commands
    default: true
  rideonhead.admin:
    description: Allows administrative ride commands
    default: op